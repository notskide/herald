<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herald Game Hub</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background-color: #121212; color: #e0e0e0; height: 100vh; display: flex; align-items: center; justify-content: center; }
.panel { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 30px; width: 90%; max-width: 450px; }
.dashboard-panel { max-width: 900px; display: flex; flex-direction: column; height: 90vh; }
.screen { display: none; width: 100%; }
.screen.active { display: flex; justify-content: center; }
h1 { text-align: center; font-size: 1.8rem; margin-bottom: 5px; color: #fff; }
h2 { text-align: center; font-size: 1.3rem; margin-bottom: 20px; color: #ccc; }
p { text-align: center; margin-bottom: 20px; color: #999; }
.btn { background: #333; border: 1px solid #444; color: #fff; padding: 12px; font-size: 1rem; border-radius: 4px; cursor: pointer; width: 100%; margin-bottom: 10px; }
.btn:hover { background: #444; }
.btn-primary { background: #0056b3; border-color: #004494; }
.btn-primary:hover { background: #004494; }
.input-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #bbb; }
select, input { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; width: 100%; font-size: 1rem; }
.room-list { margin-top: 15px; border-top: 1px solid #333; padding-top: 15px; max-height: 200px; overflow-y: auto; }
.room-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
.code-display { font-size: 2rem; font-weight: bold; text-align: center; letter-spacing: 5px; margin: 15px 0; color: #fff; }
.dashboard-layout { display: flex; gap: 20px; flex: 1; min-height: 0; }
.main-content { flex: 2; display: flex; flex-direction: column; overflow-y: auto; }
.chat-sidebar { flex: 1; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; display: flex; flex-direction: column; }
.chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.chat-message { background: #333; padding: 8px; border-radius: 4px; font-size: 0.9rem; word-break: break-word; }
.chat-message.self { background: #0056b3; align-self: flex-end; }
.chat-input-area { display: flex; padding: 10px; border-top: 1px solid #444; }
.chat-input-area input { border-radius: 4px 0 0 4px; margin: 0; }
.chat-input-area button { width: auto; border-radius: 0 4px 4px 0; margin: 0; padding: 0 15px; }
.games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
.game-card { background: #2a2a2a; border: 1px solid #444; border-radius: 4px; padding: 15px; text-align: center; cursor: pointer; }
.game-card:hover { background: #333; }
</style>
</head>
<body>

<div id="home" class="screen active">
    <div class="panel">
        <h1>HERALD HUB</h1>
        <div class="input-group">
            <label>Choose Username</label>
            <input type="text" id="usernameInput" placeholder="Enter name..." maxlength="12">
        </div>
        <button class="btn btn-primary" onclick="navigate('createRoom')">Create a Room</button>
        <button class="btn" onclick="navigate('joinRoom')">Join a Room</button>
    </div>
</div>

<div id="createRoom" class="screen">
    <div class="panel">
        <h2>Host a Game</h2>
        <div class="input-group">
            <label>Room Name</label>
            <input type="text" id="roomName" placeholder="Enter room name" maxlength="15">
        </div>
        <div class="input-group">
            <label>Max Players</label>
            <select id="playerCount">
                <option value="2">2 Players</option>
                <option value="4">4 Players</option>
                <option value="8">8 Players</option>
            </select>
        </div>
        <div class="input-group">
            <label>Room Type</label>
            <select id="roomPrivacy">
                <option value="public">Public</option>
                <option value="private">Private</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="generateRoom()">Create Room</button>
        <button class="btn" onclick="navigate('home')">Back</button>
    </div>
</div>

<div id="joinRoom" class="screen">
    <div class="panel">
        <h2>Join a Game</h2>
        <div class="input-group">
            <label>Private Code</label>
            <input type="text" id="roomCode" placeholder="Enter code" maxlength="8">
            <button class="btn btn-primary" onclick="joinWithCode()" style="margin-top: 10px;">Join via Code</button>
        </div>
        <div class="room-list" id="publicRoomsList"></div>
        <button class="btn" onclick="navigate('home')" style="margin-top: 10px;">Back</button>
    </div>
</div>

<div id="lobby" class="screen">
    <div class="panel">
        <h2 id="lobbyTitle">Waiting for players...</h2>
        <div id="privateCodeContainer" style="display: none;">
            <p>Share this code:</p>
            <div class="code-display" id="displayCode"></div>
        </div>
        <p>Players: <span id="playerCounter">1 / 4</span></p>
        <button class="btn btn-primary" id="startGameBtn" onclick="requestStart()" style="display: none;">Launch Dashboard</button>
        <button class="btn" onclick="leaveRoom()">Leave Room</button>
    </div>
</div>

<div id="dashboard" class="screen">
    <div class="panel dashboard-panel">
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <h2>HUB DASHBOARD</h2>
            <div style="color: #aaa;"><span id="dashRoomInfo">Room</span> | <span id="dashPlayerInfo">Players</span></div>
        </div>
        
        <div class="dashboard-layout">
            <div class="main-content" id="gameArea">
                <h3 style="text-align:center;">Local Games</h3>
                <div class="games-grid">
                    <div class="game-card">Tic-Tac-Toe</div>
                    <div class="game-card">Snake</div>
                    <div class="game-card">Rock Paper Scissors</div>
                </div>
                <button class="btn" onclick="leaveRoom()" style="margin-top: auto;">Disconnect</button>
            </div>
            
            <div class="chat-sidebar">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="Message..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                    <button class="btn btn-primary" onclick="sendChatMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
const ws = new WebSocket(protocol + window.location.host + '/ws');
let myUsername = "Player_" + Math.floor(Math.random() * 1000);
document.getElementById('usernameInput').value = myUsername;

let currentRoom = null;
let isHost = false;

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'rooms_update') {
        renderPublicRooms(data.rooms);
    } else if (data.type === 'room_joined') {
        currentRoom = data.code;
        isHost = data.is_host;
        setupLobby(data.code);
        switchScreen('lobby');
    } else if (data.type === 'room_state') {
        document.getElementById('playerCounter').innerText = `${data.players} / ${data.max}`;
        document.getElementById('dashPlayerInfo').innerText = `Players: ${data.players}/${data.max}`;
        if (data.host) {
            isHost = true;
            document.getElementById('startGameBtn').style.display = 'block';
            document.getElementById('lobbyTitle').innerText = "Host Lobby";
        }
    } else if (data.type === 'chat_update') {
        renderChat(data.messages);
    } else if (data.type === 'launch_dashboard') {
        document.getElementById('dashRoomInfo').innerText = `Room: ${currentRoom}`;
        switchScreen('dashboard');
    } else if (data.type === 'error') {
        alert(data.message);
    }
};

document.getElementById('usernameInput').addEventListener('input', (e) => {
    myUsername = e.target.value;
    ws.send(JSON.stringify({ type: "set_user", user: myUsername }));
});

function switchScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function navigate(id) {
    switchScreen(id);
}

function renderPublicRooms(rooms) {
    const list = document.getElementById('publicRoomsList');
    list.innerHTML = rooms.length === 0 ? '<p>No public rooms available.</p>' : '';
    rooms.forEach(r => {
        const item = document.createElement('div');
        item.className = 'room-item';
        const isFull = r.players >= r.max;
        item.innerHTML = `
            <div><strong>${r.name}</strong><br><small>${r.players} / ${r.max}</small></div>
            <button class="btn btn-primary" onclick="joinRoom('${r.code}')" style="width:auto; padding:5px 15px;" ${isFull ? 'disabled' : ''}>${isFull ? 'Full' : 'Join'}</button>
        `;
        list.appendChild(item);
    });
}

function generateRoom() {
    const name = document.getElementById('roomName').value || `${myUsername}'s Room`;
    ws.send(JSON.stringify({
        type: "create_room",
        name: name,
        max: document.getElementById('playerCount').value,
        privacy: document.getElementById('roomPrivacy').value
    }));
}

function joinWithCode() {
    joinRoom(document.getElementById('roomCode').value.toUpperCase());
}

function joinRoom(code) {
    ws.send(JSON.stringify({ type: "join_room", code: code }));
}

function setupLobby(code) {
    const isPrivate = code.startsWith('PRV_');
    document.getElementById('privateCodeContainer').style.display = isPrivate ? 'block' : 'none';
    document.getElementById('displayCode').innerText = code;
    document.getElementById('startGameBtn').style.display = isHost ? 'block' : 'none';
    document.getElementById('lobbyTitle').innerText = isHost ? "Host Lobby" : "Waiting for host...";
}

function requestStart() {
    ws.send(JSON.stringify({ type: "start_game" }));
}

function leaveRoom() {
    ws.send(JSON.stringify({ type: "leave_room" }));
    currentRoom = null;
    isHost = false;
    document.getElementById('chatMessages').innerHTML = '';
    switchScreen('home');
}

function sendChatMessage() {
    const input = document.getElementById('chatInput');
    if (!input.value.trim()) return;
    ws.send(JSON.stringify({ type: "chat", text: input.value.trim() }));
    input.value = '';
}

function renderChat(messages) {
    const container = document.getElementById('chatMessages');
    container.innerHTML = '';
    messages.forEach(msg => {
        const isSelf = msg.sender === myUsername;
        const div = document.createElement('div');
        div.className = `chat-message ${isSelf ? 'self' : ''}`;
        div.innerText = `${isSelf ? 'You' : msg.sender}: ${msg.text}`;
        container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
}
</script>
</body>
</html>
