<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Herald Game Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    user-select: none;
}

body {
    background: linear-gradient(-45deg, #0a0a12, #120e24, #00111a, #050508);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: #fff;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.glass-panel {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    border-radius: 20px;
    padding: 40px;
    width: 90%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.screen {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.95);
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    width: 100%;
    display: flex;
    justify-content: center;
}

.screen.active {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
}

.screen.swipe-left {
    transform: translate(-100%, -50%) scale(0.95);
}

.screen.swipe-right {
    transform: translate(0%, -50%) scale(0.95);
}

h1 {
    text-align: center;
    font-weight: 800;
    font-size: 2rem;
    letter-spacing: 2px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #00f2ff, #8000ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

h2 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 15px;
    color: #e0c0ff;
}

.btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(0, 242, 255, 0.3);
    color: #fff;
    padding: 15px 20px;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
    width: 100%;
    outline: none;
}

.btn:hover, .btn:active {
    background: rgba(0, 242, 255, 0.15);
    border-color: #00f2ff;
    box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
    transform: translateY(-2px);
}

.btn-purple {
    border-color: rgba(128, 0, 255, 0.3);
}

.btn-purple:hover, .btn-purple:active {
    background: rgba(128, 0, 255, 0.15);
    border-color: #8000ff;
    box-shadow: 0 0 20px rgba(128, 0, 255, 0.4);
}

.btn-secondary {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: none;
}

.btn-secondary:hover, .btn-secondary:active {
    background: rgba(255, 255, 255, 0.1);
    border-color: #fff;
    box-shadow: none;
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

label {
    font-size: 0.9rem;
    color: #aaa;
    margin-left: 5px;
}

select, input {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    padding: 15px;
    border-radius: 12px;
    font-size: 1.1rem;
    outline: none;
    transition: border-color 0.3s ease;
    width: 100%;
}

select:focus, input:focus {
    border-color: #00f2ff;
}

.room-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 200px;
    overflow-y: auto;
    padding-right: 5px;
}

.room-list::-webkit-scrollbar {
    width: 6px;
}

.room-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
}

.room-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 15px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.room-item-details {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.room-name {
    font-weight: 600;
    color: #00f2ff;
}

.room-players {
    font-size: 0.8rem;
    color: #aaa;
}

.join-btn {
    padding: 8px 15px;
    font-size: 0.9rem;
    width: auto;
}

.code-display {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: 8px;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 20px #8000ff;
    margin: 20px 0;
}

.loader {
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top: 3px solid #00f2ff;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
    margin: 0 auto;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

#dashboard {
    max-width: 900px;
}

.games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.game-card {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
    cursor: pointer;
}

.game-card:hover {
    border-color: #00f2ff;
    box-shadow: 0 10px 30px rgba(0, 242, 255, 0.2);
    transform: translateY(-5px);
}

.game-icon {
    font-size: 3rem;
    margin-bottom: 15px;
}

.game-title {
    font-size: 1.2rem;
    font-weight: 600;
    color: #fff;
}

@media (max-width: 768px) {
    .glass-panel {
        width: 95%;
        padding: 30px 20px;
    }
    h1 {
        font-size: 1.8rem;
    }
    .games-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div id="home" class="screen active">
    <div class="glass-panel">
        <h1>HERALD HUB</h1>
        <p style="text-align: center; color: #aaa; margin-bottom: 20px;">Welcome to the ultimate arcade</p>
        <button class="btn" onclick="navigate('home', 'createRoom')">Create a Room</button>
        <button class="btn btn-purple" onclick="navigate('home', 'joinRoom')">Join a Room</button>
    </div>
</div>

<div id="createRoom" class="screen">
    <div class="glass-panel">
        <h2>Host a Game</h2>
        
        <div class="input-group">
            <label for="playerCount">Max Players</label>
            <select id="playerCount">
                <option value="2">2 Players</option>
                <option value="3">3 Players</option>
                <option value="4">4 Players</option>
                <option value="8">8 Players</option>
            </select>
        </div>

        <div class="input-group">
            <label for="roomPrivacy">Room Type</label>
            <select id="roomPrivacy">
                <option value="public">Public (Visible to everyone)</option>
                <option value="private">Private (Code required)</option>
            </select>
        </div>

        <button class="btn" onclick="generateRoom()">Create Room</button>
        <button class="btn btn-secondary" onclick="navigate('createRoom', 'home', true)">Back</button>
    </div>
</div>

<div id="joinRoom" class="screen">
    <div class="glass-panel">
        <h2>Join a Game</h2>
        
        <div class="input-group">
            <label for="roomCode">Have a Private Code?</label>
            <input type="text" id="roomCode" placeholder="Enter 5-digit code" maxlength="5" style="text-transform: uppercase; text-align: center; letter-spacing: 5px; font-weight: bold;">
            <button class="btn btn-purple" onclick="joinWithCode()" style="margin-top: 10px;">Join via Code</button>
        </div>

        <div style="text-align: center; margin: 15px 0; color: #aaa; font-size: 0.9rem;">OR BROWSE PUBLIC ROOMS</div>

        <div class="room-list" id="publicRoomsList">
        </div>

        <button class="btn btn-secondary" onclick="navigate('joinRoom', 'home', true)" style="margin-top: 10px;">Back</button>
    </div>
</div>

<div id="lobby" class="screen">
    <div class="glass-panel">
        <h2 id="lobbyTitle">Waiting for players...</h2>
        
        <div id="privateCodeContainer" style="display: none;">
            <p style="text-align: center; color: #aaa;">Share this code with your friends:</p>
            <div class="code-display" id="displayCode"></div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
            <span>Players connected:</span>
            <span style="font-weight: bold; color: #00f2ff;" id="playerCounter">1 / 4</span>
        </div>
        
        <div class="loader" id="lobbyLoader"></div>

        <button class="btn" id="startGameBtn" onclick="launchDashboard()" style="margin-top: 20px; display: none;">Launch Dashboard</button>
        <button class="btn btn-secondary" onclick="leaveLobby()" style="margin-top: 10px;">Leave Room</button>
    </div>
</div>

<div id="dashboard" class="screen">
    <div class="glass-panel">
        <h1>CHOOSE A GAME</h1>
        <div style="display: flex; justify-content: space-between; color: #aaa; font-size: 0.9rem;">
            <span id="dashRoomInfo">Room: PUBLIC</span>
            <span id="dashPlayerInfo">Players: 4/4</span>
        </div>
        
        <div class="games-grid">
            <div class="game-card" onclick="playGame('Neon Tic-Tac-Toe')">
                <div class="game-icon">❌⭕</div>
                <div class="game-title">Neon Tic-Tac-Toe</div>
            </div>
            <div class="game-card" onclick="playGame('Trivia Clash')">
                <div class="game-icon">🧠⚡</div>
                <div class="game-title">Trivia Clash</div>
            </div>
            <div class="game-card" onclick="playGame('Draw & Guess')">
                <div class="game-icon">🎨🖌️</div>
                <div class="game-title">Draw & Guess</div>
            </div>
        </div>

        <button class="btn btn-secondary" onclick="leaveLobby()" style="margin-top: 20px;">Disconnect</button>
    </div>
</div>

<script>
const mockPublicRooms = [
    { name: "Neon Strikers", players: 2, max: 4, code: "PUB01" },
    { name: "Late Night Chill", players: 1, max: 8, code: "PUB02" },
    { name: "Pro Gamers Only", players: 3, max: 4, code: "PUB03" }
];

let currentRoomData = {
    isHost: false,
    privacy: 'public',
    code: '',
    players: 1,
    maxPlayers: 4
};

function navigate(fromId, toId, reverse = false) {
    const fromScreen = document.getElementById(fromId);
    const toScreen = document.getElementById(toId);
    
    fromScreen.classList.remove('active');
    
    if (reverse) {
        fromScreen.style.transform = 'translate(100%, -50%) scale(0.95)';
    } else {
        fromScreen.style.transform = 'translate(-100%, -50%) scale(0.95)';
    }

    setTimeout(() => {
        fromScreen.style.transform = 'translate(-50%, -50%) scale(0.95)';
    }, 400);

    toScreen.style.transform = reverse ? 'translate(-100%, -50%) scale(0.95)' : 'translate(100%, -50%) scale(0.95)';
    
    setTimeout(() => {
        toScreen.classList.add('active');
        if (toId === 'joinRoom') {
            renderPublicRooms();
        }
    }, 50);
}

function renderPublicRooms() {
    const list = document.getElementById('publicRoomsList');
    list.innerHTML = '';
    
    mockPublicRooms.forEach(room => {
        const item = document.createElement('div');
        item.className = 'room-item';
        item.innerHTML = `
            <div class="room-item-details">
                <span class="room-name">${room.name}</span>
                <span class="room-players">${room.players} / ${room.max} Players</span>
            </div>
            <button class="btn join-btn" onclick="joinPublicRoom(${room.max})">Join</button>
        `;
        list.appendChild(item);
    });
}

function generateRoom() {
    const max = document.getElementById('playerCount').value;
    const privacy = document.getElementById('roomPrivacy').value;
    
    currentRoomData = {
        isHost: true,
        privacy: privacy,
        maxPlayers: max,
        players: 1,
        code: privacy === 'private' ? Math.random().toString(36).substring(2, 7).toUpperCase() : 'PUBLIC'
    };

    setupLobby();
    navigate('createRoom', 'lobby');
}

function joinWithCode() {
    const code = document.getElementById('roomCode').value.toUpperCase();
    if (code.length === 5) {
        currentRoomData = {
            isHost: false,
            privacy: 'private',
            maxPlayers: 4,
            players: 2,
            code: code
        };
        setupLobby();
        navigate('joinRoom', 'lobby');
    } else {
        alert("Please enter a valid 5-digit code.");
    }
}

function joinPublicRoom(max) {
    currentRoomData = {
        isHost: false,
        privacy: 'public',
        maxPlayers: max,
        players: 2,
        code: 'PUBLIC'
    };
    setupLobby();
    navigate('joinRoom', 'lobby');
}

function setupLobby() {
    document.getElementById('playerCounter').innerText = `${currentRoomData.players} / ${currentRoomData.maxPlayers}`;
    const codeContainer = document.getElementById('privateCodeContainer');
    const startBtn = document.getElementById('startGameBtn');
    const loader = document.getElementById('lobbyLoader');
    const title = document.getElementById('lobbyTitle');

    if (currentRoomData.privacy === 'private') {
        codeContainer.style.display = 'block';
        document.getElementById('displayCode').innerText = currentRoomData.code;
    } else {
        codeContainer.style.display = 'none';
    }

    if (currentRoomData.isHost) {
        title.innerText = "Host Lobby";
        startBtn.style.display = 'block';
        loader.style.display = 'none';
    } else {
        title.innerText = "Waiting for host...";
        startBtn.style.display = 'none';
        loader.style.display = 'block';
        
        setTimeout(() => {
            launchDashboard();
        }, 3000);
    }
}

function launchDashboard() {
    document.getElementById('dashRoomInfo').innerText = `Room: ${currentRoomData.privacy === 'private' ? currentRoomData.code : 'PUBLIC'}`;
    document.getElementById('dashPlayerInfo').innerText = `Players: ${currentRoomData.players}/${currentRoomData.maxPlayers}`;
    navigate('lobby', 'dashboard');
}

function leaveLobby() {
    const currentScreen = document.querySelector('.screen.active').id;
    navigate(currentScreen, 'home', true);
}

function playGame(gameName) {
    document.querySelector('#dashboard .glass-panel').innerHTML = `
        <h1>${gameName.toUpperCase()}</h1>
        <div style="height: 300px; display: flex; align-items: center; justify-content: center; border: 2px dashed rgba(255,255,255,0.2); border-radius: 16px; margin: 20px 0; background: rgba(0,0,0,0.5);">
            <p style="color: #00f2ff; font-size: 1.2rem; font-weight: bold; animation: pulse 2s infinite;">Game Canvas Active</p>
        </div>
        <button class="btn btn-secondary" onclick="resetDashboard()">Back to Games</button>
        <style>@keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }</style>
    `;
}

function resetDashboard() {
    const dash = document.getElementById('dashboard');
    dash.innerHTML = `
    <div class="glass-panel">
        <h1>CHOOSE A GAME</h1>
        <div style="display: flex; justify-content: space-between; color: #aaa; font-size: 0.9rem;">
            <span id="dashRoomInfo">Room: ${currentRoomData.privacy === 'private' ? currentRoomData.code : 'PUBLIC'}</span>
            <span id="dashPlayerInfo">Players: ${currentRoomData.players}/${currentRoomData.maxPlayers}</span>
        </div>
        <div class="games-grid">
            <div class="game-card" onclick="playGame('Neon Tic-Tac-Toe')">
                <div class="game-icon">❌⭕</div>
                <div class="game-title">Neon Tic-Tac-Toe</div>
            </div>
            <div class="game-card" onclick="playGame('Trivia Clash')">
                <div class="game-icon">🧠⚡</div>
                <div class="game-title">Trivia Clash</div>
            </div>
            <div class="game-card" onclick="playGame('Draw & Guess')">
                <div class="game-icon">🎨🖌️</div>
                <div class="game-title">Draw & Guess</div>
            </div>
        </div>
        <button class="btn btn-secondary" onclick="leaveLobby()" style="margin-top: 20px;">Disconnect</button>
    </div>
    `;
}
</script>
</body>
</html>
