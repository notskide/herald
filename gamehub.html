<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herald Game Hub</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: sans-serif;
}

body {
    background-color: #121212;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.panel {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 30px;
    width: 90%;
    max-width: 450px;
}

.screen {
    display: none;
    width: 100%;
}

.screen.active {
    display: flex;
    justify-content: center;
}

h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 5px;
    color: #fff;
}

h2 {
    text-align: center;
    font-size: 1.3rem;
    margin-bottom: 20px;
    color: #ccc;
}

p {
    text-align: center;
    margin-bottom: 20px;
    color: #999;
}

.btn {
    background: #333;
    border: 1px solid #444;
    color: #fff;
    padding: 12px;
    font-size: 1rem;
    border-radius: 4px;
    cursor: pointer;
    width: 100%;
    margin-bottom: 10px;
}

.btn:hover {
    background: #444;
}

.btn-primary {
    background: #0056b3;
    border-color: #004494;
}

.btn-primary:hover {
    background: #004494;
}

.input-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 5px;
    font-size: 0.9rem;
    color: #bbb;
}

select, input {
    background: #2a2a2a;
    border: 1px solid #444;
    color: #fff;
    padding: 10px;
    border-radius: 4px;
    width: 100%;
    font-size: 1rem;
}

.room-list {
    margin-top: 15px;
    border-top: 1px solid #333;
    padding-top: 15px;
}

.room-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #2a2a2a;
    padding: 10px;
    border-radius: 4px;
    margin-bottom: 10px;
}

.code-display {
    font-size: 2rem;
    font-weight: bold;
    text-align: center;
    letter-spacing: 5px;
    margin: 15px 0;
    color: #fff;
}

.games-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 15px;
}

.game-card {
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
}

.game-card:hover {
    background: #333;
}
</style>
</head>
<body>

<div id="home" class="screen active">
    <div class="panel">
        <h1>HERALD HUB</h1>
        <p>Welcome to the arcade</p>
        <button class="btn btn-primary" onclick="navigate('home', 'createRoom')">Create a Room</button>
        <button class="btn" onclick="navigate('home', 'joinRoom')">Join a Room</button>
    </div>
</div>

<div id="createRoom" class="screen">
    <div class="panel">
        <h2>Host a Game</h2>
        <div class="input-group">
            <label for="playerCount">Max Players</label>
            <select id="playerCount">
                <option value="2">2 Players</option>
                <option value="3">3 Players</option>
                <option value="4">4 Players</option>
                <option value="8">8 Players</option>
            </select>
        </div>
        <div class="input-group">
            <label for="roomPrivacy">Room Type</label>
            <select id="roomPrivacy">
                <option value="public">Public</option>
                <option value="private">Private</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="generateRoom()">Create Room</button>
        <button class="btn" onclick="navigate('createRoom', 'home')">Back</button>
    </div>
</div>

<div id="joinRoom" class="screen">
    <div class="panel">
        <h2>Join a Game</h2>
        <div class="input-group">
            <label for="roomCode">Private Code</label>
            <input type="text" id="roomCode" placeholder="Enter code" maxlength="5">
            <button class="btn btn-primary" onclick="joinWithCode()" style="margin-top: 10px;">Join via Code</button>
        </div>
        <div class="room-list" id="publicRoomsList"></div>
        <button class="btn" onclick="navigate('joinRoom', 'home')" style="margin-top: 10px;">Back</button>
    </div>
</div>

<div id="lobby" class="screen">
    <div class="panel">
        <h2 id="lobbyTitle">Waiting for players...</h2>
        <div id="privateCodeContainer" style="display: none;">
            <p>Share this code:</p>
            <div class="code-display" id="displayCode"></div>
        </div>
        <p>Players: <span id="playerCounter">1 / 4</span></p>
        <button class="btn btn-primary" id="startGameBtn" onclick="launchDashboard()" style="display: none;">Launch Dashboard</button>
        <button class="btn" onclick="leaveLobby()">Leave Room</button>
    </div>
</div>

<div id="dashboard" class="screen">
    <div class="panel">
        <h2>CHOOSE A GAME</h2>
        <p><span id="dashRoomInfo">Room: PUBLIC</span> | <span id="dashPlayerInfo">Players: 4/4</span></p>
        <div class="games-grid">
            <div class="game-card" onclick="playGame('Neon Tic-Tac-Toe')">Tic-Tac-Toe</div>
            <div class="game-card" onclick="playGame('Trivia Clash')">Trivia Clash</div>
            <div class="game-card" onclick="playGame('Draw & Guess')">Draw & Guess</div>
        </div>
        <button class="btn" onclick="leaveLobby()" style="margin-top: 20px;">Disconnect</button>
    </div>
</div>

<script>
const mockPublicRooms = [
    { name: "Neon Strikers", players: 2, max: 4, code: "PUB01" },
    { name: "Late Night Chill", players: 1, max: 8, code: "PUB02" },
    { name: "Pro Gamers Only", players: 3, max: 4, code: "PUB03" }
];

let currentRoomData = {
    isHost: false,
    privacy: 'public',
    code: '',
    players: 1,
    maxPlayers: 4
};

function navigate(fromId, toId) {
    document.getElementById(fromId).classList.remove('active');
    document.getElementById(toId).classList.add('active');
    
    if (toId === 'joinRoom') {
        renderPublicRooms();
    }
}

function renderPublicRooms() {
    const list = document.getElementById('publicRoomsList');
    list.innerHTML = '';
    
    mockPublicRooms.forEach(room => {
        const item = document.createElement('div');
        item.className = 'room-item';
        item.innerHTML = `
            <div>
                <strong>${room.name}</strong><br>
                <small>${room.players} / ${room.max} Players</small>
            </div>
            <button class="btn btn-primary" onclick="joinPublicRoom(${room.max})" style="width: auto; margin: 0; padding: 5px 15px;">Join</button>
        `;
        list.appendChild(item);
    });
}

function generateRoom() {
    const max = document.getElementById('playerCount').value;
    const privacy = document.getElementById('roomPrivacy').value;
    
    currentRoomData = {
        isHost: true,
        privacy: privacy,
        maxPlayers: max,
        players: 1,
        code: privacy === 'private' ? Math.random().toString(36).substring(2, 7).toUpperCase() : 'PUBLIC'
    };

    setupLobby();
    navigate('createRoom', 'lobby');
}

function joinWithCode() {
    const code = document.getElementById('roomCode').value.toUpperCase();
    if (code.length === 5) {
        currentRoomData = {
            isHost: false,
            privacy: 'private',
            maxPlayers: 4,
            players: 2,
            code: code
        };
        setupLobby();
        navigate('joinRoom', 'lobby');
    } else {
        alert("Please enter a valid 5-digit code.");
    }
}

function joinPublicRoom(max) {
    currentRoomData = {
        isHost: false,
        privacy: 'public',
        maxPlayers: max,
        players: 2,
        code: 'PUBLIC'
    };
    setupLobby();
    navigate('joinRoom', 'lobby');
}

function setupLobby() {
    document.getElementById('playerCounter').innerText = `${currentRoomData.players} / ${currentRoomData.maxPlayers}`;
    const codeContainer = document.getElementById('privateCodeContainer');
    const startBtn = document.getElementById('startGameBtn');
    const title = document.getElementById('lobbyTitle');

    if (currentRoomData.privacy === 'private') {
        codeContainer.style.display = 'block';
        document.getElementById('displayCode').innerText = currentRoomData.code;
    } else {
        codeContainer.style.display = 'none';
    }

    if (currentRoomData.isHost) {
        title.innerText = "Host Lobby";
        startBtn.style.display = 'block';
    } else {
        title.innerText = "Waiting for host...";
        startBtn.style.display = 'none';
        
        setTimeout(() => {
            launchDashboard();
        }, 3000);
    }
}

function launchDashboard() {
    document.getElementById('dashRoomInfo').innerText = `Room: ${currentRoomData.privacy === 'private' ? currentRoomData.code : 'PUBLIC'}`;
    document.getElementById('dashPlayerInfo').innerText = `Players: ${currentRoomData.players}/${currentRoomData.maxPlayers}`;
    navigate('lobby', 'dashboard');
}

function leaveLobby() {
    const currentScreen = document.querySelector('.screen.active').id;
    navigate(currentScreen, 'home');
}

function playGame(gameName) {
    const dashPanel = document.querySelector('#dashboard .panel');
    dashPanel.innerHTML = `
        <h2>${gameName.toUpperCase()}</h2>
        <div style="height: 200px; display: flex; align-items: center; justify-content: center; border: 1px dashed #444; margin: 20px 0; background: #2a2a2a;">
            <p style="margin: 0;">Game Canvas Active</p>
        </div>
        <button class="btn" onclick="resetDashboard()">Back to Games</button>
    `;
}

function resetDashboard() {
    const dash = document.getElementById('dashboard');
    dash.innerHTML = `
    <div class="panel">
        <h2>CHOOSE A GAME</h2>
        <p><span id="dashRoomInfo">Room: ${currentRoomData.privacy === 'private' ? currentRoomData.code : 'PUBLIC'}</span> | <span id="dashPlayerInfo">Players: ${currentRoomData.players}/${currentRoomData.maxPlayers}</span></p>
        <div class="games-grid">
            <div class="game-card" onclick="playGame('Neon Tic-Tac-Toe')">Tic-Tac-Toe</div>
            <div class="game-card" onclick="playGame('Trivia Clash')">Trivia Clash</div>
            <div class="game-card" onclick="playGame('Draw & Guess')">Draw & Guess</div>
        </div>
        <button class="btn" onclick="leaveLobby()" style="margin-top: 20px;">Disconnect</button>
    </div>
    `;
}
</script>
</body>
</html>
